git:
  commit:
    autoWrapCommitMessage: true
    autoWrapWidth: 72

gui:
  commitLength:
    show: true
  # Catppuccin Mocha theme
  # See: https://github.com/catppuccin/lazygit
  theme:
    activeBorderColor:
      - '#89b4fa'
      - bold
    inactiveBorderColor:
      - '#a6adc8'
    searchingActiveBorderColor:
      - '#f9e2af'
    optionsTextColor:
      - '#89b4fa'
    selectedLineBgColor:
      - '#313244'
    inactiveViewSelectedLineBgColor:
      - '#6c7086'
    cherryPickedCommitFgColor:
      - '#89b4fa'
    cherryPickedCommitBgColor:
      - '#45475a'
    markedBaseCommitFgColor:
      - '#89b4fa'
    markedBaseCommitBgColor:
      - '#f9e2af'
    unstagedChangesColor:
      - '#f38ba8'
    defaultFgColor:
      - '#cdd6f4'
  authorColors:
    '*': '#b4befe'

customCommands:
  - key: "G"
    description: "AI-powered conventional commit"
    context: "global"
    prompts:
      - type: "menu"
        key: "Type"
        title: "Type of change"
        options:
          - name: "ai"
            description: "Let AI analyze and determine the best commit type"
            value: "ai-defined"
          - name: "built"
            description: "changes that affect the build system or external dependencies"
            value: "build"
          - name: "chore"
            description: "other changes that don't modify src or test files"
            value: "chore"
          - name: "ci"
            description: "changes to ci configuration files and scripts"
            value: "ci"
          - name: "docs"
            description: "documentation only changes"
            value: "docs"
          - name: "feat"
            description: "a new feature"
            value: "feat"
          - name: "fix"
            description: "a bug fix"
            value: "fix"
          - name: "perf"
            description: "a code change that improves performance"
            value: "perf"
          - name: "refactor"
            description: "a code change that neither fixes a bug nor adds a feature"
            value: "refactor"
          - name: "revert"
            description: "reverts a previous commit"
            value: "revert"
          - name: "style"
            description: "changes that do not affect the meaning of the code"
            value: "style"
          - name: "test"
            description: "adding missing tests or correcting existing tests"
            value: "test"
      - type: "menuFromCommand"
        title: "AI Generated Commit Titles"
        key: "CommitTitle"
        command: 'ai-commit --type {{.Form.Type}} --part title'
      - type: "menuFromCommand"
        title: "AI Generated Problem Statements"
        key: "Problem"
        command: 'ai-commit --type {{.Form.Type}} --part problem --title "{{.Form.CommitTitle}}"'
      - type: "menuFromCommand"
        title: "AI Generated Solution Statements"
        key: "Solution"
        command: 'ai-commit --type {{.Form.Type}} --part solution --title "{{.Form.CommitTitle}}" --problem "{{.Form.Problem}}"'
    command: 'git commit -m "{{.Form.CommitTitle}}" -m "{{.Form.Problem}}" -m "{{.Form.Solution}}"'
    loadingText: "Generating commit messages..."
