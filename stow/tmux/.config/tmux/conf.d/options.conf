# -- Terminal ----------------------------------------------------------------
# Pin Kitty terminfo so image.nvim graphics clear/scroll correctly in tmux.
# Requires: bash ~/dotfiles/scripts/wezterm.sh  (installs ~/.terminfo xterm-kitty)
# Do not use "${TERM}" — a server started with xterm-256color bakes that in.
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:RGB" # defer to kitty-terminfo

# -- General -----------------------------------------------------------------
set -g escape-time 0 # prevent delay due to <ESC>
set -g mouse on # enable use of mouse
set -g repeat-time 1000 # repeat key without need for <leader>
set -g history-limit 50000 # n lines stored

# -- Windows & panes ---------------------------------------------------------
set -g base-index 1 # window index start at 1
set -g pane-base-index 1 # pane index start at 1
set -g renumber-windows on # renumber if middle pane/window closed

# -- image.nvim --------------------------------------------------------------
set -g focus-events on # forward focus events to apps (required by image.nvim)
set -g allow-passthrough on # required by image.nvim to display images
set -g visual-activity off # related to image.nvim

# -- Automatic window renaming -----------------------------------------------
set -g status-interval 10 # every _ seconds
set -g automatic-rename on
set -g automatic-rename-format "#{b:pane_current_path}"

# -- Status bar --------------------------------------------------------------
set -g status on
set -g status-position top
set -g status-justify centre
set -g status-left-length 100
set -g status-right-length 100
