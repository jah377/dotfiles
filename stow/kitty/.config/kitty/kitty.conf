# Kitty terminal emulator configuration
# See: https://sw.kovidgoyal.net/kitty/conf/

# -- Fonts -----------------------------------------------------------------
# kitty list-fonts --psnames | grep "JetBrains"
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14

# Break ligatures when cursor is on them so individual characters are visible
disable_ligatures cursor

# -- Cursor ----------------------------------------------------------------
cursor_shape block
cursor_blink_interval 0

# Prominent cursor trail for tracking large cursor jumps
cursor_trail 3
cursor_trail_decay 0.2 0.6
cursor_trail_start_threshold 2

# -- Scrollback ------------------------------------------------------------
scrollback_lines 10000
scrollbar never

# Use neovim as scrollback pager for full editor navigation of scrollback
# See: https://sw.kovidgoyal.net/kitty/conf/#opt-kitty.scrollback_pager
scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -

# -- Shell integration -----------------------------------------------------
# 'no-cursor' is required to defer cursor shape control to zsh-vi-mode, which
# sets block in normal mode and beam in insert mode. Without this flag, kitty's
# shell integration overrides the cursor to beam at prompts, conflicting with
# zsh-vi-mode behavior.
shell_integration enabled no-cursor

# -- Terminal bell ---------------------------------------------------------
enable_audio_bell no

# -- Window layout ---------------------------------------------------------
# Disable title bar, keep window resizable
hide_window_decorations titlebar-only

# Padding: top right bottom left (in pts)
# window_padding_width 5 5 0 5
window_padding_width 0 0 0 0 

# Never prompt when closing the window
confirm_os_window_close 0

# -- Tab bar ---------------------------------------------------------------
# Tabs are not used; tmux handles window/session management
tab_bar_min_tabs 2

# -- Color scheme ----------------------------------------------------------
# Automatically switch between Catppuccin Mocha (dark) and Catppuccin Latte
# (light) based on macOS system appearance. Theme files are downloaded by
# scripts/kitty.sh from https://github.com/catppuccin/kitty
auto_color_scheme dark light

# -- macOS tweaks ----------------------------------------------------------
# Must set to 'both' otherwise cannot use fzf ALT keybindings
macos_option_as_alt both

# Quit kitty when last window is closed; tmux handles session persistence
macos_quit_when_last_window_closed yes

# -- Keyboard shortcuts ----------------------------------------------------
# Disable 'Ctrl+=', keybinding used for smart selection in treesitter.lua
map ctrl+equal no_op

# -- Advanced --------------------------------------------------------------
term xterm-kitty
